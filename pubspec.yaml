name: specimen_box
description: "化石箱 — 日々の問いに答えて、一見意味不明な化石を集めるアプリ"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  in_app_purchase: ^3.3.0
  http: ^1.2.2
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0
  fake_async: ^1.3.1
  sqlite3: ^3.3.2
  # FileImageStore のテストで path_provider をモックするため（再ビルド後の画像解決の回帰テスト）。
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:

  uses-material-design: true

  # 発掘演出のフラグメントシェーダ。
  shaders:
    - shaders/excavation.frag

  assets:
    - assets/questions/

  fonts:
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ZenMaruGothic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
        - asset: assets/fonts/ZenMaruGothic-Black.ttf
          weight: 900
